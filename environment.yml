# Conda environment for the CPU-only reproduction path.
#   conda env create -f environment.yml && conda activate amr-dual
# Versions are the ones the released results were produced with; looser bounds
# are given in requirements.txt for pip users.
name: amr-dual
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy=2.3.*
  - pandas=2.3.*
  - scipy=1.16.*
  - scikit-learn=1.7.*
  - matplotlib=3.10.*
  - biopython=1.85
  - pip
  - pip:
      # GPU-only extras; comment out for a pure CPU install
      # - torch==2.12.0
      # - fair-esm==2.0.0
      - -r requirements.txt
